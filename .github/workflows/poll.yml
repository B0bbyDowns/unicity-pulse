name: poll-gateway

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sample the gateway
        run: node poll.mjs

      - name: Commit if data changed
        run: |
          git config user.name  "unicity-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date -u +%FT%TZ)"
            git push
          fi
